# このブランチに push するたびに、GitHub Pages へ自動で公開する。
# 公開先 → https://yanyoou-web.github.io/-/
#
# ※ はじめの1回だけ、持ち主の操作が必要です。
#    リポジトリの Settings → Pages → Source を「GitHub Actions」にしてください。
#    （Pages を有効にする操作だけは、GitHub がワークフローに許可していないため）
#
# 公開は main から行う。GitHub が作る github-pages 環境は、既定で
# 「既定のブランチからのみ公開可」になっているため、作業ブランチからは公開できない。
name: Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pages の設定を読む
        uses: actions/configure-pages@v5
      - name: 中身をまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: 公開する
        id: deploy
        uses: actions/deploy-pages@v4
